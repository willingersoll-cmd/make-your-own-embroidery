<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Little Thread · Progress layouts</title><link rel="stylesheet" href="garden.css"><style>body{padding:48px 5%;min-height:100vh}.comparison{max-width:1280px;margin:auto}h1{font:32px var(--hand);letter-spacing:0;margin-bottom:32px}.choices{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:24px}h2{font-size:21px;font-weight:400;margin:0 0 16px}iframe{width:100%;height:212px;border:0}a{display:inline-block;padding:9px 16px;border:1px solid #b5baa4;border-radius:3px;background:#f7f4eb;font-size:17px}p{font-size:17px;color:#727662;margin:12px 0 20px}@media(max-width:1050px){.choices{grid-template-columns:1fr;max-width:420px}}</style></head><body><section class="comparison"><h1>Three ways to keep stitching</h1><div class="choices"><article><h2>A · Left aligned</h2><iframe title="Left aligned progress" src="progress-card.html?layout=left"></iframe><p>Count and status together; finish below.</p><a href="./?layout=left">Try layout A</a></article><article><h2>B · Side by side</h2><iframe title="Side by side progress" src="progress-card.html?layout=inline"></iframe><p>The finish action sits beside the count.</p><a href="./?layout=inline">Try layout B</a></article><article><h2>C · Action row</h2><iframe title="Action row progress" src="progress-card.html?layout=footer"></iframe><p>Finish and start over share a bottom row.</p><a href="./?layout=footer">Try layout C</a></article></div></section></body></html>
