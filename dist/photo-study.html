6 0-13 9-13 9Z" stroke="#81906a" stroke-width="2.5" stroke-dasharray="2 2"/><path d="M26 43c-12 2-10-9-18-4" stroke="#b48c64" stroke-width="1.2" stroke-dasharray="3 3"/></svg></div>
