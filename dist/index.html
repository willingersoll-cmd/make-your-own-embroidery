<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#f4f0e6"><meta name="description" content="Turn an image into line embroidery. Hover to stitch, then save or share it."><meta property="og:title" content="Little Thread — a photo worth a thousand stitches"><meta property="og:description" content="Upload an image, stitch it with your cursor, and share the result."><title>Little Thread — a photo worth a thousand stitches</title><link rel="preload" href="assets/shantell-sans-medium.ttf" as="font" type="font/ttf" crossorigin><link rel="stylesheet" href="garden.css"><script src="thread-engine.js" defer></script><script src="garden.js" defer></script><script src="garden-share.js" defer></script></head>
<body>
<header class="site-header"><a class="brand" href="garden.html"><svg viewBox="0 0 50 50" aria-hidden="true"><g fill="none" stroke-width="6" stroke-linecap="round"><path stroke="#b96950" d="M25 22C10 17 12 4 19 9c5 3 6 13 6 13Z"/><path stroke="#cc9a46" d="M28 23C29 8 42 9 39 17c-2 5-11 6-11 6Z"/><path stroke="#7e8b68" d="M29 27c16-1 16 12 8 11-5-1-8-11-8-11Z"/><path stroke="#6b8790" d="M25 29c6 15-7 20-8 12-1-6 8-12 8-12Z"/><path stroke="#b3828c" d="M21 26C6 34 2 21 10 20c5 0 11 6 11 6Z"/></g></svg><span>little thread<span class="brand-dot">.</span></span></a></header>
<main><section class="introduction"><h1>A photo worth<br><em>a thousand stitches.</em></h1><p class="invitation">Upload an image. Move across the hoop to stitch it.</p></section>
<div class="editor-layout">
<aside class="upload-bar sewing-box" aria-label="Sewing box"><div class="box-lid" aria-hidden="true"><i class="box-hinge"></i><i class="box-hinge"></i><svg viewBox="0 0 80 50"><path d="M26 43c7-13 14-18 27-34" stroke="#7b8865" stroke-width="2"/><path d="M34 32c-14-1-17-14-8-12 6 1 8 12 8 12Zm9-11c0-14 12-18 10-9-2 6-10 9-10 9Zm-4 7c15 2 23-9 13-9-6 0-13 9-13 9Z" stroke="#81906a" stroke-width="2.5" stroke-dasharray="2 2"/><path d="M26 43c-12 2-10-9-18-4" stroke="#b48c64" stroke-width="1.2" stroke-dasharray="3 3"/></svg></div>
<div class="source-section"><label class="upload-button" for="image-upload"><span class="upload-art" aria-hidden="true">↥</span><strong>Upload an image</strong><span class="upload-sub">PNG, JPG, WebP · up to 25 MB</span></label><input id="image-upload" type="file" accept="image/*"><button id="sample-garden" class="sample-button"><img id="source-thumb" src="assets/sample-bouquet.svg" alt=""><span>Try the sample</span><span>↗</span></button><p id="upload-message" role="status">Your photo stays on your device.</p></div>
<div class="upload-options">
<fieldset id="line-detail-label"><legend class="control-label">Detail</legend><select id="line-detail" hidden aria-label="Line detail"><option value="clean">Simple</option><option value="detailed" selected>Detailed</option><option value="intricate">Extra</option></select><div class="segmented" data-control="line-detail"><button data-value="clean" aria-pressed="false">Simple</button><button data-value="detailed" aria-pressed="true">Detailed</button><button data-value="intricate" aria-pressed="false">Extra</button></div></fieldset>
<fieldset><legend class="control-label">Thread size</legend><select id="stitch-size" hidden aria-label="Stitch size"><option value="7" selected>Fine</option><option value="10">Regular</option><option value="14">Chunky</option></select><div class="size-options" data-control="stitch-size"><button data-value="7" aria-pressed="true"><i style="--thread:2px"></i>Fine</button><button data-value="10" aria-pressed="false"><i style="--thread:4px"></i>Classic</button><button data-value="14" aria-pressed="false"><i style="--thread:6px"></i>Chunky</button></div></fieldset><label class="needle-option"><svg viewBox="0 0 45 20" aria-hidden="true"><path d="M3 13 41 3 7 16Q2 17 3 13Z"/><path d="m7 13 4-1"/></svg><span><strong>Show the needle</strong></span><input id="needle-toggle" type="checkbox"></label></div>
</aside>
<section class="garden" aria-label="Interactive image embroidery"><div class="board-heading"><button id="reference-toggle" aria-pressed="false">View original ↗</button></div>
<div class="hoop-holder"><div class="hoop-clasp" aria-hidden="true"><i></i></div><div class="art-frame" id="art-frame"><canvas id="garden-canvas" role="img" aria-label="Hover over the cloth to reveal an embroidered garden."></canvas><div id="sections" aria-label="Garden sections"></div><div id="cursor-ring" aria-hidden="true"></div><div class="reference-view" id="reference-view" hidden><img src="assets/sample-bouquet.svg" alt="The original garden reference."></div><span class="frame-label" id="frame-label"></span><div class="canvas-hint" id="canvas-hint" aria-hidden="true"><span>✣</span> Hover to stitch <i>↖</i></div></div>
</div><div class="garden-toolbar"><div class="progress"><div class="progress-stitches" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i><i></i></div><div><span id="garden-status" role="status" aria-live="polite">Ready</span><span id="garden-count">0 stitches</span></div></div><div class="actions"><label class="guide-toggle"><input type="checkbox" id="guides" checked><span></span> Pencil guide</label><button id="reset" aria-label="Start the embroidery again">↺</button><button id="reveal-all" class="finish-button">Finish stitching <span>↗</span></button></div></div>
<div id="completion" class="completion" hidden><div class="finish-flower" aria-hidden="true"><svg viewBox="0 0 64 64"><path d="M32 31C10 20 22 4 30 15s2 16 2 16c0-27 22-22 19-9S32 31 32 31c27-3 26 21 12 18S32 31 32 31c10 26-15 29-17 16s17-16 17-16C8 43 1 21 15 21s17 10 17 10Z"/><circle cx="32" cy="31" r="3"/></svg></div><div><h3>All stitched.</h3></div><button id="open-share" class="sewn-button">Share embroidery <span>↗</span></button></div>
</section></div>
<footer><p id="artwork-caption">Sample bouquet</p><span>Images stay on your device.</span></footer></main>
<dialog id="share-dialog" aria-labelledby="share-title"><button class="dialog-close" id="close-share" aria-label="Close sharing">×</button><div class="share-layout"><div class="share-preview-wrap"><div class="share-card-placeholder"><img id="share-preview" alt="Your finished embroidery, framed as a shareable card."></div><div class="segmented format-control"><button data-format="square" aria-pressed="true">Square</button><button data-format="story" aria-pressed="false">Story</button></div></div><div class="share-copy"><h2 id="share-title">Share your embroidery</h2><button id="native-share" class="sewn-button" disabled>Share image ↗</button><div class="share-destinations"><button id="share-messages"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 11a8 8 0 0 1-8 8H5l-3 3 1-7a8 8 0 1 1 17-4Z"/><path d="M7 10h.1m4 0h.1m4 0h.1"/></svg>Messages</button><button id="share-x"><span>𝕏</span>X</button><button id="share-instagram"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="5"/><circle cx="12" cy="12" r="4"/><path d="M17.5 6.5h.1"/></svg>Instagram</button></div><div class="share-utilities"><button id="download-card">Save image ↓</button><button id="copy-card">Copy image ⧉</button></div><p id="share-note" role="status">Preparing your card…</p></div></div></dialog>
<div id="toast" class="toast" role="status" hidden></div></body></html>
