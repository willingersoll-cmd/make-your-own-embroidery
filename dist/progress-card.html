<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="garden.css"><style>body{background:none;padding:0}.sewing-box:before,.sewing-box:after{display:none}.sewing-box .garden-toolbar{margin:0;min-height:164px}html[data-progress-layout=footer] .sewing-box .garden-toolbar{min-height:194px}</style><script>document.documentElement.dataset.progressLayout=new URLSearchParams(location.search).get('layout')||'left';</script></head><body><section class="sewing-box"><div class="garden-toolbar"><div class="progress"><div class="progress-stitches" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i><i></i></div><div><span id="garden-status" role="status" aria-live="polite">Keep stitching</span><span id="garden-count"><strong id="count-completed" class="count-completed">77</strong><span class="count-divider">/</span><span id="count-total" class="count-total">1,112</span><span class="count-unit">stitches</span></span></div></div><div class="actions"><label class="guide-toggle"><span>Pencil guide</span><input type="checkbox" role="switch" id="guides" checked></label><button id="reset" aria-label="Start over">Start over</button><button id="reveal-all" class="finish-button">Finish stitching </button></div></div></section></body></html>
